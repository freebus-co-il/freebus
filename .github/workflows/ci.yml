name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm --prefix api ci
      - run: npm --prefix api run typecheck
      # `test`, not `test:live` -- the live suites need network and real
      # upstreams, and a CI run that depends on a third party is a CI run
      # that fails for reasons the contributor cannot fix.
      - run: npm --prefix api test

  gtfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gtfs/package-lock.json
      - run: npm --prefix gtfs ci
      - run: npm --prefix gtfs run typecheck
      - run: npm --prefix gtfs test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci

      # Regenerate `app/expo-env.d.ts`, which Expo's own .gitignore excludes
      # (app/.gitignore) and which is therefore never checked out here. Its
      # single `/// <reference types="expo/types" />` is what declares the
      # CSS module types, so without it `import '@/global.css'` in
      # src/constants/theme.ts fails typecheck with TS2882 -- while passing
      # on any developer machine, where the file exists locally.
      #
      # `expo customize` rather than committing the file: it is generated
      # per SDK version, so a committed copy would go stale silently on the
      # next Expo upgrade. Verified to leave tsconfig.json untouched.
      - run: npx expo customize tsconfig.json
        working-directory: app

      - run: npm --prefix app run typecheck
      - run: npm --prefix app run lint
      - run: npm --prefix app test
