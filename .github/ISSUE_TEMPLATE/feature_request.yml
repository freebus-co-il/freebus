name: Feature request
description: Propose something new or a change to existing behavior
labels: ["enhancement"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Which project?
      options:
        - api
        - gtfs
        - app
        - Not sure / spans more than one
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation today and why it's a problem, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd like to see happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, including doing nothing, and why you didn't prefer them.
    validations:
      required: false
