name: Bug report
description: Report something that is broken
labels: ["bug"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Which project?
      options:
        - api
        - gtfs
        - app
        - Not sure / spans more than one
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, as exact as you can make them.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        For `app` issues: device/OS (e.g. "iPhone 15, iOS 18.1" or "Pixel 8,
        Android 15"), Expo Go vs. a dev build. For `api`/`gtfs`: Node version,
        OS, and whether you're running via Docker Compose or `npm run dev`.
      placeholder: |
        - Device/OS:
        - Node version:
        - How you ran it:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs, stack traces, or a screenshot. This will be rendered as a code block, so no need to add backticks.
      render: shell
    validations:
      required: false
